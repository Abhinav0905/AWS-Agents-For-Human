<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1120" viewBox="0 0 680 560" role="img">
<title>Postscript architecture overview</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
 .t{font:14px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2c2c2a}.th{font:500 14px "Helvetica Neue",Helvetica,Arial,sans-serif}.ts{font:12px "Helvetica Neue",Helvetica,Arial,sans-serif}
 .box{fill:#f7f6f2;stroke:#b4b2a9;stroke-width:.5}.teal rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0f6e56}
 .coral rect{fill:#faece7;stroke:#993c1d;stroke-width:.5}.coral .th{fill:#712b13}.coral .ts{fill:#993c1d}.neutral .th{fill:#2c2c2a}.neutral .ts{fill:#5f5e5a}
 .arr{stroke:#5f5e5a;stroke-width:1.2;fill:none}
</style>
<rect width="680" height="560" fill="#ffffff"/>
<rect class="box" x="220" y="40" width="240" height="472" rx="20"/>
<text class="th neutral" x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Postscript on AgentCore</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Strands Agents SDK</text>
<g class="teal"><rect x="240" y="100" width="200" height="56" rx="8"/><text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">Intake agent</text><text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central">Mail to ledger entries</text></g>
<g class="teal"><rect x="240" y="184" width="200" height="56" rx="8"/><text class="th" x="340" y="202" text-anchor="middle" dominant-baseline="central">Runner agent</text><text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">One task per tick</text></g>
<g class="teal"><rect x="240" y="268" width="200" height="56" rx="8"/><text class="th" x="340" y="286" text-anchor="middle" dominant-baseline="central">Interruption governor</text><text class="ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">Cedar via Interventions</text></g>
<g class="teal"><rect x="240" y="352" width="200" height="56" rx="8"/><text class="th" x="340" y="370" text-anchor="middle" dominant-baseline="central">Receipt hooks</text><text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">Hash-chained tool calls</text></g>
<g class="neutral"><rect class="box" x="240" y="436" width="200" height="56" rx="8"/><text class="th" x="340" y="454" text-anchor="middle" dominant-baseline="central">Stores</text><text class="ts" x="340" y="472" text-anchor="middle" dominant-baseline="central">Ledger in S3, AgentCore Memory</text></g>
<line x1="340" y1="156" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="240" x2="340" y2="264" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="324" x2="340" y2="348" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="236" width="156" height="190" rx="12" fill="none" stroke="#b4b2a9" stroke-width=".5" stroke-dasharray="4 3"/>
<text class="th" x="118" y="254" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Executor (human)</text>
<g class="coral"><rect x="48" y="268" width="140" height="56" rx="8"/><text class="th" x="118" y="286" text-anchor="middle" dominant-baseline="central">Decision inbox</text><text class="ts" x="118" y="304" text-anchor="middle" dominant-baseline="central">Web and SMS</text></g>
<g class="coral"><rect x="48" y="352" width="140" height="56" rx="8"/><text class="th" x="118" y="370" text-anchor="middle" dominant-baseline="central">Accounting PDF</text><text class="ts" x="118" y="388" text-anchor="middle" dominant-baseline="central">Verified receipts</text></g>
<g class="neutral"><rect class="box" x="490" y="100" width="150" height="56" rx="8"/><text class="th" x="565" y="118" text-anchor="middle" dominant-baseline="central">Estate mail</text><text class="ts" x="565" y="136" text-anchor="middle" dominant-baseline="central">Scans, PDFs, emails</text></g>
<g class="neutral"><rect class="box" x="490" y="184" width="150" height="56" rx="8"/><text class="th" x="565" y="202" text-anchor="middle" dominant-baseline="central">EventBridge tick</text><text class="ts" x="565" y="220" text-anchor="middle" dominant-baseline="central">Runs daily</text></g>
<g class="neutral"><rect class="box" x="490" y="268" width="150" height="56" rx="8"/><text class="th" x="565" y="286" text-anchor="middle" dominant-baseline="central">Institutions</text><text class="ts" x="565" y="304" text-anchor="middle" dominant-baseline="central">Simulated via MCP</text></g>
<line x1="490" y1="128" x2="444" y2="128" class="arr" marker-end="url(#arrow)"/><line x1="490" y1="212" x2="444" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="444" y1="296" x2="486" y2="296" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="236" y1="296" x2="192" y2="296" class="arr" marker-end="url(#arrow)"/><line x1="236" y1="380" x2="192" y2="380" class="arr" marker-end="url(#arrow)"/>
<rect x="220" y="522" width="12" height="12" rx="2" fill="#e1f5ee" stroke="#0f6e56" stroke-width=".5"/><text class="ts" x="240" y="528" dominant-baseline="central" fill="#5f5e5a">Agents on AgentCore</text>
<rect x="380" y="522" width="12" height="12" rx="2" fill="#faece7" stroke="#993c1d" stroke-width=".5"/><text class="ts" x="400" y="528" dominant-baseline="central" fill="#5f5e5a">What the executor sees</text>
</svg>
