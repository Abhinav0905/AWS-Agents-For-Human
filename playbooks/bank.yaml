kind: bank
summary: Freeze, then close or transfer accounts; banks usually want originals by mail.
documents:
- death_certificate
- letters_testamentary
originals_typical: true
channel: mail
typical_response_days: 7
initial_task: notify
likely_flags:
  consumes_original: true
  irreversible: true
escalation_days:
- 7
- 14
- 21
letter: 'To {institution},


  I am writing to inform you that {decedent}, the holder of the account ending in {last4}, died on {dod}.
  I am the executor of the estate. Please note the account accordingly and tell me what you need from
  me to close the accounts and release funds to the estate. A copy of the death certificate is enclosed
  (certified original where required).


  Sincerely,

  {executor}, Executor'
