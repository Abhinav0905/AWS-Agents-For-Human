kind: dmv
summary: Transfer or sell the vehicle; title transfers need the executor in person.
documents:
- death_certificate
- title
channel: in_person
typical_response_days: 20
initial_task: transfer
likely_flags:
  requires_signature: true
escalation_days:
- 7
- 14
- 21
letter: 'To {institution},


  I am writing to inform you that {decedent}, the holder of the account ending in {last4}, died on {dod}.
  I am the executor of the estate. Please note the account accordingly and tell me what you need from
  me to transfer the vehicle title. A copy of the death certificate is enclosed.


  Sincerely,

  {executor}, Executor'
