kind: gym
summary: Cancel in writing; expect to send a certified letter.
documents:
- death_certificate
channel: mail
typical_response_days: 5
initial_task: cancel
likely_flags: {}
escalation_days:
- 7
- 14
- 21
letter: 'To {institution},


  I am writing to inform you that {decedent}, the holder of the account ending in {last4}, died on {dod}.
  I am the executor of the estate. Please note the account accordingly and tell me what you need from
  me to cancel the membership and stop billing. A copy of the death certificate is enclosed.


  Sincerely,

  {executor}, Executor'
