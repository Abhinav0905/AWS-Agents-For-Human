kind: insurer
summary: Open the claim with a copy; the claim itself needs an original and a payout election.
documents:
- death_certificate
- claim_form
channel: mail
typical_response_days: 7
initial_task: claim
likely_flags:
  consumes_original: true
  irreversible: true
escalation_days:
- 7
- 14
- 21
letter: 'To {institution},


  I am writing to inform you that {decedent}, the holder of the account ending in {last4}, died on {dod}.
  I am the executor of the estate. Please note the account accordingly and tell me what you need from
  me to open the life insurance claim. A copy of the death certificate is enclosed.


  Sincerely,

  {executor}, Executor'
