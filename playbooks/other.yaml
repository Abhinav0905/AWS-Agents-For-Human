kind: other
summary: Notify and ask what they need.
documents:
- death_certificate
channel: mail
typical_response_days: 10
initial_task: notify
likely_flags: {}
escalation_days:
- 7
- 14
- 21
letter: 'To {institution},


  I am writing to inform you that {decedent}, the holder of the account ending in {last4}, died on {dod}.
  I am the executor of the estate. Please note the account accordingly and tell me what you need from
  me to close or transfer the account. A copy of the death certificate is enclosed.


  Sincerely,

  {executor}, Executor'
