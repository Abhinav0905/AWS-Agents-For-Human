[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postscript"
version = "0.1.0"
description = "Postscript: a background agent for estate executors, built on Strands Agents (Agents for Humans hackathon)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kumar Abhinav" }]
dependencies = [
  "strands-agents[cedar]>=1.55,<2",
  "strands-agents-tools>=0.8,<1",
  "mcp>=1.10",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rich>=13",
  "structlog>=24",
  "reportlab>=4",
  "pypdf>=4",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3",
  "python-multipart>=0.0.9",
  "cedarpy>=4",
]

[project.optional-dependencies]
aws = ["bedrock-agentcore>=0.1", "bedrock-agentcore[strands-agents]", "boto3>=1.34", "strands-agents[otel]"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
postscript = "postscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The tick, the runner and the clerk catch broad exceptions on purpose: one failing task
# must never stop a day's work, and every failure is written to the ledger and the receipt chain.
ignore = ["B008", "E402"]

[tool.ruff.lint.per-file-ignores]
# The dashboard holds an inline HTML/CSS/JS template; wrapping it would only make it harder to read.
"src/postscript/dashboard/app.py" = ["E501"]
